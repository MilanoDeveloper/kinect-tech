openapi: 3.0.3
info:
  title: Kinect Tech - Orchestrator API
  description: BFF API that coordinates requests to the persons, payments and training programs services.
  version: 1.0.0
tags:
  - name: Persons
    description: Person operations exposed by the BFF
  - name: Payments
    description: Payment operations exposed by the BFF
  - name: TrainingPrograms
    description: Training program operations exposed by the BFF
paths:
  /api/v1/persons:
    post:
      summary: Create a person
      operationId: createPerson
      tags: [Persons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
            example:
              username: maria.silva
              password: SenhaSegura123
              name: Maria Silva
              birthDate: '12-04-1995'
              gender: F
              personType: ALUNO
              cpf: '52998224725'
              email: maria.silva@example.com
              internalPersonal: false
              height: 1.68
              weight: 64.5
              bodyFatPercentage: 22.4
              medicalConditions: []
      responses:
        '201':
          description: Person created
        '400':
          description: Invalid person data
        '409':
          description: Username, CPF or email already registered
        '502':
          description: A downstream service is unavailable
    get:
      summary: List persons
      operationId: getPersons
      tags: [Persons]
      responses:
        '200':
          description: Persons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetPersonsApi'
              example:
                - id: 1
                  username: maria.silva
                  name: Maria Silva
                  birthDate: '12-04-1995'
                  gender: F
                  personType: ALUNO
                  cpf: '52998224725'
                  email: maria.silva@example.com
                  internalPersonal: false
                  height: 1.68
                  weight: 64.5
                  bodyFatPercentage: 22.4
                  medicalConditions: []
                  createdAt: '03-10-2026'
                  updatedAt: '03-10-2026'
        '502':
          description: A downstream service is unavailable
  /api/v1/persons/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      summary: Get a person by id
      operationId: getPersonById
      tags: [Persons]
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPersonsApi'
              example:
                id: 1
                username: maria.silva
                name: Maria Silva
                birthDate: '12-04-1995'
                gender: F
                personType: ALUNO
                cpf: '52998224725'
                email: maria.silva@example.com
                internalPersonal: false
                height: 1.68
                weight: 64.5
                bodyFatPercentage: 22.4
                medicalConditions: []
                createdAt: '03-10-2026'
                updatedAt: '03-10-2026'
        '404':
          description: Person not found
        '502':
          description: A downstream service is unavailable
    put:
      summary: Update a person
      operationId: updatePerson
      tags: [Persons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
            example:
              username: maria.silva
              password: SenhaSegura123
              name: Maria Silva
              birthDate: '12-04-1995'
              gender: F
              personType: ALUNO
              cpf: '52998224725'
              email: maria.silva@example.com
              internalPersonal: false
              height: 1.68
              weight: 64.5
              bodyFatPercentage: 22.4
              medicalConditions: []
      responses:
        '204':
          description: Person updated
        '404':
          description: Person not found
        '409':
          description: Username, CPF or email already registered
        '502':
          description: A downstream service is unavailable
    delete:
      summary: Delete a person
      operationId: deletePerson
      tags: [Persons]
      responses:
        '204':
          description: Person deleted
        '404':
          description: Person not found
        '502':
          description: A downstream service is unavailable
  /api/v1/payments:
    post:
      summary: Create a payment for an existing person
      operationId: createPayment
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              personId: 1
              amount: 149.90
              method: PIX
              installmentCount: 1
              dueDate: '03-11-2026'
              status: PENDING
              description: Mensalidade da academia
      responses:
        '201':
          description: Payment created
        '404':
          description: Person not found
        '502':
          description: A downstream service is unavailable
    get:
      summary: List payments
      operationId: getPayments
      tags: [Payments]
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
              example:
                - id: 1
                  personId: 1
                  amount: 149.90
                  method: PIX
                  installmentCount: 1
                  dueDate: '03-11-2026'
                  status: PENDING
                  description: Mensalidade da academia
                  createdAt: '03-10-2026'
                  updatedAt: '03-10-2026'
        '502':
          description: A downstream service is unavailable
  /api/v1/payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      summary: Get a payment by id
      operationId: getPaymentById
      tags: [Payments]
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 1
                personId: 1
                amount: 149.90
                method: PIX
                installmentCount: 1
                dueDate: '03-11-2026'
                status: PENDING
                description: Mensalidade da academia
                createdAt: '03-10-2026'
                updatedAt: '03-10-2026'
        '404':
          description: Person or payment not found
        '502':
          description: A downstream service is unavailable
    put:
      summary: Update a payment for an existing person
      operationId: updatePayment
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              personId: 1
              amount: 149.90
              method: PIX
              installmentCount: 1
              dueDate: '03-11-2026'
              status: PENDING
              description: Mensalidade da academia
      responses:
        '204':
          description: Payment updated
        '404':
          description: Person or payment not found
        '502':
          description: A downstream service is unavailable
    delete:
      summary: Delete a payment
      operationId: deletePayment
      tags: [Payments]
      responses:
        '204':
          description: Payment deleted
        '404':
          description: Payment not found
        '502':
          description: A downstream service is unavailable
  /api/v1/training-programs:
    post:
      summary: Create a training program for an existing student
      operationId: createTrainingProgram
      tags: [TrainingPrograms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingProgramRequest'
            example:
              studentId: 1
              trainerId: 2
              name: Treino A - Corpo inteiro
              exercises:
                - name: Agachamento livre
                  sets: 3
                  repetitions: 12
                  restSeconds: 60
                  notes: Manter a coluna alinhada
                - name: Supino reto
                  sets: 3
                  repetitions: 10
                  restSeconds: 90
      responses:
        '201':
          description: Training program created
        '404':
          description: Student not found
        '502':
          description: A downstream service is unavailable
    get:
      summary: List training programs
      operationId: getTrainingPrograms
      tags: [TrainingPrograms]
      responses:
        '200':
          description: Training programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingProgram'
              example:
                - id: 1
                  studentId: 1
                  trainerId: 2
                  name: Treino A - Corpo inteiro
                  exercises:
                    - name: Agachamento livre
                      sets: 3
                      repetitions: 12
                      restSeconds: 60
                      notes: Manter a coluna alinhada
                    - name: Supino reto
                      sets: 3
                      repetitions: 10
                      restSeconds: 90
                  createdAt: '03-10-2026'
                  updatedAt: '03-10-2026'
        '502':
          description: A downstream service is unavailable
  /api/v1/training-programs/{trainingProgramId}:
    parameters:
      - name: trainingProgramId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      summary: Get a training program by id
      operationId: getTrainingProgramById
      tags: [TrainingPrograms]
      responses:
        '200':
          description: Training program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingProgram'
              example:
                id: 1
                studentId: 1
                trainerId: 2
                name: Treino A - Corpo inteiro
                exercises:
                  - name: Agachamento livre
                    sets: 3
                    repetitions: 12
                    restSeconds: 60
                    notes: Manter a coluna alinhada
                  - name: Supino reto
                    sets: 3
                    repetitions: 10
                    restSeconds: 90
                createdAt: '03-10-2026'
                updatedAt: '03-10-2026'
        '404':
          description: Training program not found
        '502':
          description: A downstream service is unavailable
    put:
      summary: Update a training program for an existing student
      operationId: updateTrainingProgram
      tags: [TrainingPrograms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingProgramRequest'
            example:
              studentId: 1
              trainerId: 2
              name: Treino A - Corpo inteiro
              exercises:
                - name: Agachamento livre
                  sets: 3
                  repetitions: 12
                  restSeconds: 60
                  notes: Manter a coluna alinhada
                - name: Supino reto
                  sets: 3
                  repetitions: 10
                  restSeconds: 90
      responses:
        '204':
          description: Training program updated
        '404':
          description: Student or training program not found
        '502':
          description: A downstream service is unavailable
    delete:
      summary: Delete a training program
      operationId: deleteTrainingProgram
      tags: [TrainingPrograms]
      responses:
        '204':
          description: Training program deleted
        '404':
          description: Training program not found
        '502':
          description: A downstream service is unavailable
components:
  schemas:
    CreatePersonRequest:
      type: object
      required: [username, password, name, birthDate, gender, personType, cpf, email]
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 50
          example: maria.silva
        password:
          type: string
          minLength: 6
          example: SenhaSegura123
        name:
          type: string
          maxLength: 150
          example: Maria Silva
        birthDate:
          type: string
          example: '12-04-1995'
        gender:
          type: string
          enum: [M, F]
          example: F
        personType:
          type: string
          enum: [ALUNO, PERSONAL, ADMIN]
          example: ALUNO
        cpf:
          type: string
          minLength: 11
          maxLength: 11
          example: '52998224725'
        email:
          type: string
          format: email
          example: maria.silva@example.com
        internalPersonal:
          type: boolean
          example: false
        cref:
          type: string
          example: CREF-123456-G/SP
        note:
          type: string
          example: Objetivo de condicionamento físico
        height:
          type: number
          format: double
          minimum: 0
          example: 1.68
        weight:
          type: number
          format: double
          minimum: 0
          example: 64.5
        bodyFatPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 22.4
        medicalConditions:
          type: array
          items:
            type: string
          example: []
    GetPersonsApi:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: maria.silva
        name:
          type: string
          example: Maria Silva
        birthDate:
          type: string
          example: '12-04-1995'
        gender:
          type: string
          enum: [M, F]
          example: F
        personType:
          type: string
          enum: [ALUNO, PERSONAL, ADMIN]
          example: ALUNO
        cpf:
          type: string
          example: '52998224725'
        email:
          type: string
          format: email
          example: maria.silva@example.com
        internalPersonal:
          type: boolean
          example: false
        cref:
          type: string
          example: CREF-123456-G/SP
        note:
          type: string
          example: Objetivo de condicionamento físico
        height:
          type: number
          format: double
          example: 1.68
        weight:
          type: number
          format: double
          example: 64.5
        bodyFatPercentage:
          type: number
          format: double
          example: 22.4
        medicalConditions:
          type: array
          items:
            type: string
          example: []
        createdAt:
          type: string
          example: '03-10-2026'
        updatedAt:
          type: string
          example: '03-10-2026'
    PaymentRequest:
      type: object
      required: [personId, amount, method, dueDate]
      properties:
        personId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          minimum: 0
          example: 149.90
        method:
          type: string
          enum: [CREDIT, DEBIT, CASH, PIX]
          example: PIX
        installmentCount:
          type: integer
          minimum: 1
          default: 1
          example: 1
        dueDate:
          type: string
          example: '03-11-2026'
        paidAt:
          type: string
          example: '03-11-2026'
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
          default: PENDING
          example: PENDING
        description:
          type: string
          maxLength: 255
          example: Mensalidade da academia
    Payment:
      type: object
      required: [id, personId, amount, method, dueDate]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        personId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          minimum: 0
          example: 149.90
        method:
          type: string
          enum: [CREDIT, DEBIT, CASH, PIX]
          example: PIX
        installmentCount:
          type: integer
          minimum: 1
          default: 1
          example: 1
        dueDate:
          type: string
          example: '03-11-2026'
        paidAt:
          type: string
          example: '03-11-2026'
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
          default: PENDING
          example: PENDING
        description:
          type: string
          maxLength: 255
          example: Mensalidade da academia
        createdAt:
          type: string
          example: '03-10-2026'
        updatedAt:
          type: string
          example: '03-10-2026'
    TrainingProgramRequest:
      type: object
      required: [studentId, trainerId, name, exercises]
      properties:
        studentId:
          type: integer
          format: int64
          example: 1
        trainerId:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          maxLength: 120
          example: Treino A - Corpo inteiro
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
    Exercise:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
          example: Agachamento livre
        sets:
          type: integer
          minimum: 1
          example: 3
        repetitions:
          type: integer
          minimum: 1
          example: 12
        restSeconds:
          type: integer
          minimum: 0
          example: 60
        notes:
          type: string
          maxLength: 500
          example: Manter a coluna alinhada
    TrainingProgram:
      allOf:
        - $ref: '#/components/schemas/TrainingProgramRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            createdAt:
              type: string
              example: '03-10-2026'
            updatedAt:
              type: string
              example: '03-10-2026'
