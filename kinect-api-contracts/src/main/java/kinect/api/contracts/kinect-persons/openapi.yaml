openapi: 3.0.3
info:
  title: Kinect Tech - Persons API Contracts
  version: 1.0.0
paths:
  /api/v1/persons:
    post:
      summary: Create a new person (Student, Personal or Admin)
      operationId: createPerson
      tags:
        - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created successfully
        '400':
          description: Invalid input data

components:
  schemas:
    CreatePersonRequest:
      type: object
      required:
        - username
        - password
        - name
        - birthDate
        - gender
        - personType
        - cpf
        - email
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 50
        password:
          type: string
          minLength: 6
        name:
          type: string
          maxLength: 150
        birthDate:
          type: string
          format: date
        gender:
          type: string
          enum: [M, F]
        personType:
          type: string
          enum: [ALUNO, PERSONAL, ADMIN]
        cpf:
          type: string
          minLength: 11
          maxLength: 11
        email:
          type: string
          format: email
        internalPersonal:
          type: boolean
        cref:
          type: string
        note:
          type: string