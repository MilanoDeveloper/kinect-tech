openapi: 3.0.3
info:
  title: Kinect Tech - Persons API Contracts
  version: 1.0.0
paths:
  /api/v1/persons:
    post:
      summary: Create a new person (Student, Personal or Admin)
      operationId: createPerson
      tags:
        - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
            example:
              username: maria.silva
              password: SenhaSegura123
              name: Maria Silva
              birthDate: '12-04-1995'
              gender: F
              personType: ALUNO
              cpf: '52998224725'
              email: maria.silva@example.com
              internalPersonal: false
              height: 1.68
              weight: 64.5
              bodyFatPercentage: 22.4
              medicalConditions: []
      responses:
        '201':
          description: Person created successfully
        '400':
          description: Invalid input data
        '409':
          description: Username, CPF or email already registered
    get:
      summary: Get Information from all persons
      operationId: getPersons
      tags:
        - Persons
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetPersonsApi'
              example:
                - id: 1
                  username: maria.silva
                  name: Maria Silva
                  birthDate: '31-01-1999'
                  gender: F
                  personType: ALUNO
                  cpf: '52998224725'
                  email: maria.silva@example.com
                  internalPersonal: false
                  height: 1.68
                  weight: 64.5
                  bodyFatPercentage: 22.4
                  medicalConditions: []
                  createdAt: '03-10-2026'
                  updatedAt: '03-10-2026'
        '400':
          description: Bad Request
  /api/v1/persons/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      summary: Get a person by id
      operationId: getPersonById
      tags:
        - Persons
      responses:
        '200':
          description: Person found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPersonsApi'
              example:
                id: 1
                username: maria.silva
                name: Maria Silva
                birthDate: '31-01-1999'
                gender: F
                personType: ALUNO
                cpf: '52998224725'
                email: maria.silva@example.com
                internalPersonal: false
                height: 1.68
                weight: 64.5
                bodyFatPercentage: 22.4
                medicalConditions: []
                createdAt: '03-10-2026'
                updatedAt: '03-10-2026'
        '404':
          description: Person not found
    put:
      summary: Update a person
      operationId: updatePerson
      tags:
        - Persons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
            example:
              username: maria.silva
              password: SenhaSegura123
              name: Maria Silva
              birthDate: '12-04-1995'
              gender: F
              personType: ALUNO
              cpf: '52998224725'
              email: maria.silva@example.com
              internalPersonal: false
              height: 1.68
              weight: 64.5
              bodyFatPercentage: 22.4
              medicalConditions: []
      responses:
        '204':
          description: Person updated
        '409':
          description: Username, CPF or email already registered
        '404':
          description: Person not found
    delete:
      summary: Delete a person
      operationId: deletePerson
      tags:
        - Persons
      responses:
        '204':
          description: Person deleted
        '404':
          description: Person not found

components:
  schemas:
    CreatePersonRequest:
      type: object
      required:
        - username
        - password
        - name
        - birthDate
        - gender
        - personType
        - cpf
        - email
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 50
          example: maria.silva
        password:
          type: string
          minLength: 6
          example: SenhaSegura123
        name:
          type: string
          maxLength: 150
          example: Maria Silva
        birthDate:
          type: string
          example: '12-04-1995'
        gender:
          type: string
          enum: [M, F]
          example: F
        personType:
          type: string
          enum: [ALUNO, PERSONAL, ADMIN]
          example: ALUNO
        cpf:
          type: string
          minLength: 11
          maxLength: 11
          example: '52998224725'
        email:
          type: string
          format: email
          example: maria.silva@example.com
        internalPersonal:
          type: boolean
          example: false
        cref:
          type: string
          example: CREF-123456-G/SP
        note:
          type: string
          example: Objetivo de condicionamento físico
        height:
          type: number
          format: double
          minimum: 0
          example: 1.68
        weight:
          type: number
          format: double
          minimum: 0
          example: 64.5
        bodyFatPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 22.4
        medicalConditions:
          type: array
          items:
            type: string
          example: []
    GetPersonsApi:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: maria.silva
        name:
          type: string
          example: Maria Silva
        birthDate:
          type: string
          example: '31-01-1999'
        gender:
          type: string
          enum: [M, F]
          example: F
        personType:
          type: string
          enum: [ALUNO, PERSONAL, ADMIN]
          example: ALUNO
        cpf:
          type: string
          example: '52998224725'
        email:
          type: string
          format: email
          example: maria.silva@example.com
        internalPersonal:
          type: boolean
          example: false
        cref:
          type: string
          example: CREF-123456-G/SP
        note:
          type: string
          example: Objetivo de condicionamento físico
        height:
          type: number
          format: double
          example: 1.68
        weight:
          type: number
          format: double
          example: 64.5
        bodyFatPercentage:
          type: number
          format: double
          example: 22.4
        medicalConditions:
          type: array
          items:
            type: string
          example: []
        createdAt:
          type: string
          example: '03-10-2026'
        updatedAt:
          type: string
          example: '03-10-2026'