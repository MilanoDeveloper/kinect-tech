openapi: 3.0.3
info:
  title: Kinect Tech - Training Programs API Contracts
  version: 1.0.0
paths:
  /api/v1/training-programs:
    post:
      summary: Create a training program
      operationId: createTrainingProgram
      tags:
        - TrainingPrograms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingProgramRequest'
      responses:
        '201':
          description: Training program created
    get:
      summary: List training programs
      operationId: getTrainingPrograms
      tags:
        - TrainingPrograms
      responses:
        '200':
          description: Training programs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainingProgram'
  /api/v1/training-programs/{trainingProgramId}:
    parameters:
      - name: trainingProgramId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get training program by id
      operationId: getTrainingProgramById
      tags:
        - TrainingPrograms
      responses:
        '200':
          description: Training program found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingProgram'
        '404':
          description: Training program not found
    put:
      summary: Update a training program
      operationId: updateTrainingProgram
      tags:
        - TrainingPrograms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingProgramRequest'
      responses:
        '204':
          description: Training program updated
        '404':
          description: Training program not found
    delete:
      summary: Delete a training program
      operationId: deleteTrainingProgram
      tags:
        - TrainingPrograms
      responses:
        '204':
          description: Training program deleted
        '404':
          description: Training program not found
components:
  schemas:
    TrainingProgramRequest:
      type: object
      required:
        - studentId
        - trainerId
        - name
        - exercises
      properties:
        studentId:
          type: integer
          format: int64
        trainerId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/Exercise'
    Exercise:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 120
        sets:
          type: integer
          minimum: 1
        repetitions:
          type: integer
          minimum: 1
        restSeconds:
          type: integer
          minimum: 0
        notes:
          type: string
          maxLength: 500
    TrainingProgram:
      allOf:
        - $ref: '#/components/schemas/TrainingProgramRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
