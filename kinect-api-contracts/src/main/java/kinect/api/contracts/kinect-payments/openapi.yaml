openapi: 3.0.3
info:
  title: Kinect Tech - Payments API Contracts
  version: 1.0.0
paths:
  /api/v1/payments:
    post:
      summary: Register a payment
      operationId: createPayment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Payment created
    get:
      summary: List payments
      operationId: getPayments
      tags:
        - Payments
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
  /api/v1/payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get payment by id
      operationId: getPaymentById
      tags:
        - Payments
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
    put:
      summary: Update a payment
      operationId: updatePayment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '204':
          description: Payment updated
        '404':
          description: Payment not found
    delete:
      summary: Delete a payment
      operationId: deletePayment
      tags:
        - Payments
      responses:
        '204':
          description: Payment deleted
        '404':
          description: Payment not found
components:
  schemas:
    PaymentRequest:
      type: object
      required:
        - personId
        - amount
        - method
        - dueDate
      properties:
        personId:
          type: integer
          format: int64
        amount:
          type: number
          minimum: 0
        method:
          type: string
          enum: [CREDIT, DEBIT, CASH, PIX]
        installmentCount:
          type: integer
          minimum: 1
          default: 1
        dueDate:
          type: string
          format: date
        paidAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
          default: PENDING
        description:
          type: string
          maxLength: 255
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
