openapi: 3.0.3
info:
  title: Kinect Tech - Payments API Contracts
  version: 1.0.0
paths:
  /api/v1/payments:
    post:
      summary: Register a payment
      operationId: createPayment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              personId: 1
              amount: 149.90
              method: PIX
              installmentCount: 1
              dueDate: '2026-11-03'
              status: PENDING
              description: Mensalidade da academia
      responses:
        '201':
          description: Payment created
    get:
      summary: List payments
      operationId: getPayments
      tags:
        - Payments
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
              example:
                - id: 1
                  personId: 1
                  amount: 149.90
                  method: PIX
                  installmentCount: 1
                  dueDate: '2026-11-03'
                  status: PENDING
                  description: Mensalidade da academia
                  createdAt: '2026-10-03T12:00:00Z'
                  updatedAt: '2026-10-03T12:00:00Z'
  /api/v1/payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
    get:
      summary: Get payment by id
      operationId: getPaymentById
      tags:
        - Payments
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
              example:
                id: 1
                personId: 1
                amount: 149.90
                method: PIX
                installmentCount: 1
                dueDate: '2026-11-03'
                status: PENDING
                description: Mensalidade da academia
                createdAt: '2026-10-03T12:00:00Z'
                updatedAt: '2026-10-03T12:00:00Z'
        '404':
          description: Payment not found
    put:
      summary: Update a payment
      operationId: updatePayment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
            example:
              personId: 1
              amount: 149.90
              method: PIX
              installmentCount: 1
              dueDate: '2026-11-03'
              status: PENDING
              description: Mensalidade da academia
      responses:
        '204':
          description: Payment updated
        '404':
          description: Payment not found
    delete:
      summary: Delete a payment
      operationId: deletePayment
      tags:
        - Payments
      responses:
        '204':
          description: Payment deleted
        '404':
          description: Payment not found
components:
  schemas:
    PaymentRequest:
      type: object
      required:
        - personId
        - amount
        - method
        - dueDate
      properties:
        personId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          minimum: 0
          example: 149.90
        method:
          type: string
          enum: [CREDIT, DEBIT, CASH, PIX]
          example: PIX
        installmentCount:
          type: integer
          minimum: 1
          default: 1
          example: 1
        dueDate:
          type: string
          format: date
          example: '2026-11-03'
        paidAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, PAID, OVERDUE, CANCELLED]
          default: PENDING
          example: PENDING
        description:
          type: string
          maxLength: 255
          example: Mensalidade da academia
    Payment:
      allOf:
        - $ref: '#/components/schemas/PaymentRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            createdAt:
              type: string
              format: date-time
              example: '2026-10-03T12:00:00Z'
            updatedAt:
              type: string
              format: date-time
              example: '2026-10-03T12:00:00Z'
