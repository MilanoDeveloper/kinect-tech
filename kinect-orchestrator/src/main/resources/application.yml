server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: kinect-orchestrator
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

kinect:
  services:
    persons-url: ${PERSONS_SERVICE_URL}
    payments-url: ${PAYMENTS_SERVICE_URL}
    training-programs-url: ${TRAINING_PROGRAMS_SERVICE_URL}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
