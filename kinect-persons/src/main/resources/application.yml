server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: kinect-persons
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: persons
        hbm2ddl:
          create_namespaces: true

